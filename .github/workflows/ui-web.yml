# Builds the simulator page in tools/ui-web and publishes it to GitHub Pages. The repository's
# Pages source must be set to GitHub Actions.
name: Simulator page

on:
  push:
    branches: [master]
    paths:
      - "crates/**"
      - "assets/**"
      - "tools/ui-web/**"
      - ".github/workflows/ui-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the toolchain tools/ui-web asks for
        working-directory: tools/ui-web
        run: rustup toolchain install
      - name: Build
        run: tools/ui-web/build.sh
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: tools/ui-web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
