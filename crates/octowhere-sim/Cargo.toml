[package]
name = "octowhere-sim"
version = "0.1.0"
edition = "2024"
description = "Several octowhere mesh nodes on the host, on virtual time, with a simulated air between them"

[dependencies]
log = "0.4.34"
octowhere-mesh = { path = "../octowhere-mesh" }
octowhere-node = { path = "../octowhere-node", features = ["run", "log", "phantom"] }

[dev-dependencies]
critical-section = { version = "1.2.0", features = ["std"] }
embedded-graphics = "0.8.2"
indicatif = "0.18.6"
octowhere-ui = { path = "../octowhere-ui", default-features = false }
octowhere-ui-script = { path = "../octowhere-ui-script" }
