[package]
name = "lc76g"
version = "0.1.0"
edition = "2024"
description = "Async I2C driver and NMEA framing support for the Quectel LC76G"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
defmt = { version = "1.1.1", optional = true }
embedded-hal-async = "1.0.0"
heapless = "0.9.3"
nmea0183 = { version = "0.6.0", default-features = false }

[features]
defmt = ["dep:defmt", "heapless/defmt"]
