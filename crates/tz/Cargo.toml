[package]
name = "octowhere-tz"
version = "0.1.0"
edition = "2024"
description = "Time zones for octowhere: the zone under a position, and local time from UTC"

[features]
default = ["boundaries"]
# The zones' boundaries, and finding the zone under a position from them. Without it only the
# tables before the boundaries are built in, and zones are found by name.
boundaries = []

