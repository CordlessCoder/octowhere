[package]
name = "octowhere-node"
version = "0.1.0"
edition = "2024"
description = "A node of the octowhere location mesh: what it shows the screens, and what it stores"

[dependencies]
defmt = { version = "1.1.1", optional = true }
embassy-futures = "0.1.2"
heapless = "0.9.3"
log = { version = "0.4.34", optional = true }
octowhere-mesh = { path = "../octowhere-mesh" }

[features]
default = []
defmt = ["dep:defmt", "octowhere-mesh/defmt"]
log = ["dep:log"]
# The node itself. Needs nightly, for the allocator API.
run = []
# A command that enrols a member no device stands behind, to try a removal on two boards.
phantom = ["run"]
