[package]
name = "octowhere-ui"
version = "0.1.0"
edition = "2024"
description = "Screens, drawing and input handling for octowhere, free of board dependencies"

[workspace]

[features]
default = []
# `Framebuffer::alloc` into a caller's allocator. Needs a nightly compiler.
allocator-api = []

[dependencies]
embassy-sync = "0.8"
embedded-graphics = "0.8"
embedded-graphics-core = "0.4"
embedded-layout = "0.4.2"
fontdue = { git = "https://github.com/CordlessCoder/fontdue", rev = "a71751e3e94864c2608a481308fc906e6302dea2", default-features = false, features = ["hashbrown"] }
fontdue-macros = { git = "https://github.com/CordlessCoder/fontdue", rev = "a71751e3e94864c2608a481308fc906e6302dea2" }
heapless = "0.9.3"
libm = "0.2.16"
