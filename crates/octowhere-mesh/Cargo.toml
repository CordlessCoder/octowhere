[package]
name = "octowhere-mesh"
version = "0.1.0"
edition = "2024"
description = "The octowhere location mesh's packets, slot schedule and timebase"

[workspace]

[features]
default = []
defmt = ["dep:defmt"]

[dependencies]
aes = "0.9.3"
aes-siv = { version = "0.8.0", default-features = false, features = ["zeroize"] }
bytemuck = { version = "1.25.2", features = ["derive", "min_const_generics"] }
defmt = { version = "1.1.1", optional = true }
hkdf = "0.13.0"
hmac = "0.13.0"
libm = "0.2.16"
sha2 = { version = "0.11.0", default-features = false }
x25519-dalek = { version = "3.0.0", default-features = false, features = ["static_secrets", "zeroize"] }

